name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Read-only. Nothing here writes to the repository, and the job that walks the
# whole history looking for secrets is the last place that should be holding a
# token which can push.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Every action is pinned to a commit, with the release it came from in the
# comment beside it. A tag is a label the publisher can move; `@v7` is a promise
# to run whatever that account points it at tomorrow, and this workflow is what
# decides whether a change is allowed to merge. Dependabot moves these pins in a
# pull request (.github/dependabot.yml), so the freshness is somebody's job
# rather than nobody's.

jobs:
  guards:
    name: Trust-boundary guards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      # Every check in this job is stdlib-only and reads the source with `ast`
      # rather than importing it, so it runs before a single dependency is
      # installed. A boundary violation is reported in seconds instead of after
      # a full resolve — and it cannot be defeated by code that fails to import.

      - name: Import boundary — agent/ and tester/ hold an HTTP client only (C-19, C-13)
        run: python scripts/check_import_boundary.py

      - name: SQL interpolation — parameterized only (C-11)
        run: python scripts/check_sql_interpolation.py

      - name: Client bundle — nothing shipped to a browser holds a key (C-16)
        run: python scripts/check_client_bundle.py

      - name: Proxy headers — the caller never picks their own rate-limit key (C-34)
        run: python scripts/check_proxy_headers.py

      - name: Only .env.example is tracked
        shell: bash
        run: |
          tracked=$(git ls-files | grep -E '(^|/)\.env($|\.)' | grep -v '\.env\.example$' || true)
          if [ -n "$tracked" ]; then
            echo "these are tracked and must not be:"
            echo "$tracked"
            exit 1
          fi
          echo "env files: only .env.example is tracked"

  tests:
    name: Tests and evals
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      # --locked, not --frozen: a lockfile that no longer matches pyproject.toml
      # fails the build rather than being silently re-resolved. CI must install
      # the same versions the developer tested against.
      #
      # --all-groups, tester included: test_the_tester_imports_the_way_streamlit
      # _runs_it executes the tester's prologue in a subprocess, and that
      # prologue imports Streamlit. On a developer machine the group is usually
      # installed already, which is exactly why the gap only showed up here.
      #
      # ...except `voice`, and that exclusion is the F12 design stated as a
      # command. Nothing in the suite needs Pipecat: the turn policy, the VAD
      # profile, the screen's verdict and the trust boundary are pure functions,
      # and `agent/pipecat/` imports the audio stack lazily so they stay
      # assertable without it. Installing it here would buy nothing, add a
      # native build to every run, and quietly weaken the one test that proves a
      # missing audio stack fails loudly rather than silently.
      - name: Install the pinned dependency set
        run: uv sync --locked --all-groups --no-group voice

      # First, and on their own, because these are the ones that gate the build.
      # If the existence oracle is back or a reference can be brute-forced, that
      # should be the first line of the log, not something found on page three.
      - name: Adversarial suite — these gate the build
        run: uv run pytest tests/adversarial -q

      - name: Full suite
        run: uv run pytest -q

      # The pytest gate for the evals is tests/adversarial/test_f11_evals.py;
      # this step exists so the 25 conversations can be read as a report in the
      # run summary rather than as a dot per test. stderr carries the structured
      # application log and is dropped here — it is noise in a summary, and the
      # redaction it goes through is tested in tests/unit/test_f11_redaction.py.
      - name: Eval suite report (F11)
        shell: bash
        run: |
          set +e
          uv run python -m evals 2>/dev/null | tee evals.txt
          status=${PIPESTATUS[0]}
          {
            echo '## Eval suite (F11)'
            echo
            echo '```'
            cat evals.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

      # Last, because it strips the environment down: the tester and the test
      # tooling are removed and the API is imported on its runtime dependencies
      # alone. Streamlit is a development tool, and a server that cannot start
      # without one has quietly made a demo aid into a production dependency.
      - name: The API runs without the tester or the test tooling
        run: |
          uv sync --locked --no-dev --no-group tester
          uv run --no-sync python -c "import app.main; print('app imports on runtime dependencies alone')"

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The whole history. A key that was committed and deleted three
          # commits later is still a leaked key — the fix is rotation, and this
          # scan is how you learn you need to rotate.
          fetch-depth: 0

      # v3 is v2 on Node 24 — same inputs, same behaviour.
      - name: gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Free for personal and public repositories. Only needed if this repo
          # ever moves under an organisation account.
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
