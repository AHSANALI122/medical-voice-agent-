[project]
name = "voicebook"
version = "0.1.0"
description = "Voice-driven medical appointment agent — authority never flows through the model"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0.36",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "cryptography>=43.0",
    "python-dateutil>=2.9",
    # Declared rather than relied on transitively through pydantic-settings:
    # agent/ reads .env itself, because it cannot import app.config (C-19).
    "python-dotenv>=1.0",
    "tzdata>=2024.2",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "freezegun>=1.5",
]
# F9. Kept out of the default install: the tester is a development tool, and the
# API must never need it to run — CI proves that by importing the app with this
# group and the dev group both removed.
#
# Most of the tester's tests (signing, redaction, the audit reader, the
# production guard) import no Streamlit, but one does: the contract test that
# runs the tester's prologue the way `streamlit run` would. So `uv run pytest`
# needs this group after all, and CI syncs with --all-groups.
#
# One coupling worth knowing about before it surprises somebody: uv resolves
# every group into one lockfile, and streamlit caps `websockets<17` while
# uvicorn[standard] only asks for `>=13`. Adding this group therefore moved the
# locked websockets from 17.1 to 16.1.1 for the runtime too. Verified fine —
# nothing here uses websockets directly and uvicorn's protocol works on 16 — but
# when F12 brings in Pipecat, this cap is the first place to look.
tester = [
    "streamlit>=1.40",
]
# F12. The audio stack, kept out of the default install for the same reason the
# tester is: the API must never need it to run, and CI proves that by importing
# the app without this group. Every module under `agent/pipecat/` imports Pipecat
# lazily and raises `PipecatUnavailable` rather than failing to import, so the
# turn policy, the VAD profile, the screen's behaviour and the trust boundary are
# all asserted in CI on a machine with none of this installed.
#
# The extras are the four the spec chose, and the reason there are only four is
# that three of them need no account at all: Silero runs locally, Piper runs
# locally, and SmallWebRTC needs no media server. Groq is the one credential, and
# it serves the LLM and Whisper both.
#
# Watch the websockets pin here. The comment above is not hypothetical any more:
# streamlit caps `websockets<17` and uvicorn[standard] asks for `>=13`, which
# already pulled the lockfile down to 16.1.1. If `uv sync --group voice` starts
# reporting a conflict, this is the first place to look, and the answer is to
# install this group in the environment that serves calls rather than alongside
# the tester.
voice = [
    "pipecat-ai[groq,piper,silero,webrtc]>=1.9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["slow: timing-sensitive checks that take a moment"]
filterwarnings = ["error::DeprecationWarning:app.*"]

[tool.uv]
package = false
